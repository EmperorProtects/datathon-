rules:
- rule_id: R231_7
  source_id: NBRK_231_2019
  clause: пункт 7
  summary_ru: Надлежащая проверка предшествует приёму и выдаче наличных.
  applicability_limits_ru: Отсутствие передачи пластиковой карточки не доказывает отсутствие надлежащей проверки.
  verified_official_text: false
- rule_id: R231_12
  source_id: NBRK_231_2019
  clause: пункт 12
  summary_ru: Личные вещи хранятся вне кассового узла; предусмотрены исключения.
  applicability_limits_ru: Допускаются лекарственные средства, медицинские изделия и средства связи без функции
    фото- и видеофиксации. Принадлежность предмета сотруднику и вид предмета требуют проверки.
  verified_official_text: false
- rule_id: R231_19_1
  source_id: NBRK_231_2019
  clause: пункт 19, подпункт 1)
  summary_ru: Визуальная идентификация по удостоверению либо цифровым данным.
  applicability_limits_ru: Нужно учитывать сервис цифровых документов и то, не выполнена ли проверка вне доступного
    фрагмента. Нельзя сводить требование к обязательной передаче пластиковой карточки.
  verified_official_text: false
- rule_id: R231_19_4
  source_id: NBRK_231_2019
  clause: пункт 19, подпункт 4)
  summary_ru: Сверка фактически принятой суммы с приходным документом.
  applicability_limits_ru: Не является запретом возвращать клиенту часть переданных денег. Необходимо знать согласованную
    сумму и содержание документа.
  verified_official_text: false
- rule_id: R231_20_PRESENCE
  source_id: NBRK_231_2019
  clause: пункт 20, абзац первый
  summary_ru: Приём и пересчёт денег выполняются в присутствии клиента.
  applicability_limits_ru: Применяется к непосредственному приёму денег от клиента. Не переносить автоматически
    на обработку инкассации или последующий внутренний пересчёт. Кассир не обязан физически удерживать клиента.
  verified_official_text: false
- rule_id: R231_20_STORAGE
  source_id: NBRK_231_2019
  clause: пункт 20, абзац второй
  summary_ru: Ранее принятые деньги хранятся в специальных запираемых устройствах.
  applicability_limits_ru: В правиле названы не только сейфы, но также металлический шкаф, тележка, ящики стола
    и тумба. Требуется отличить ранее принятую наличность от денег текущей операции.
  verified_official_text: false
- rule_id: R231_24_DOCS
  source_id: NBRK_231_2019
  clause: пункт 24, вводный абзац и подпункт 1); пункт 106
  summary_ru: Приём инкассации проводится по препроводительному документу.
  applicability_limits_ru: Это документ о передаваемой наличности, а не только удостоверение личности инкассатора.
    Необходимо учитывать цифровое оформление и направление передачи.
  verified_official_text: false
- rule_id: R231_24_ACCOUNTING
  source_id: NBRK_231_2019
  clause: пункт 24, подпункт 2)
  summary_ru: Сумма принятой инкассации регистрируется по внутреннему порядку.
  applicability_limits_ru: Отсутствие набора текста на ноутбуке не доказывает отсутствие регистрации.
  verified_official_text: false
- rule_id: R231_25
  source_id: NBRK_231_2019
  clause: пункт 25
  summary_ru: Повреждённая сумка вскрывается и пересчитывается при инкассаторе.
  applicability_limits_ru: Условие — обнаруженное нарушение целостности. Не является общим требованием немедленно
    вскрывать каждую принятую сумку.
  verified_official_text: false
- rule_id: R231_43
  source_id: NBRK_231_2019
  clause: пункт 43
  summary_ru: Сортировка проводится по номиналам и износу.
  applicability_limits_ru: Не запрещает любое временное объединение банкнот при пересчёте. Учитывать правила сборной
    упаковки.
  verified_official_text: false
- rule_id: R231_46_47
  source_id: NBRK_231_2019
  clause: пункты 46–47
  summary_ru: Корешки и обычные полные пачки формируются по номиналу.
  applicability_limits_ru: Нужно установить, что формируется именно корешок или обычная полная пачка, а не сборная
    пачка или временная стопка.
  verified_official_text: false
- rule_id: R231_49_50
  source_id: NBRK_231_2019
  clause: пункты 49–50
  summary_ru: Сборная упаковка разных номиналов допускается при установленных условиях.
  applicability_limits_ru: Исключение, препятствующее автоматической маркировке любого смешения номиналов как нарушения.
  verified_official_text: false
- rule_id: R231_74
  source_id: NBRK_231_2019
  clause: пункт 74
  summary_ru: Хранение в кладовой/сейфовой комнате — после учёта.
  applicability_limits_ru: Учёт в системе не устанавливается по движениям рук на клавиатуре. Не подменять кладовую
    или сейфовую комнату любым рабочим сейфом.
  verified_official_text: false
- rule_id: R231_76
  source_id: NBRK_231_2019
  clause: пункт 76
  summary_ru: Ключи кладовой/сейфовой комнаты находятся у ответственных лиц.
  applicability_limits_ru: Речь о замках двери кладовой или сейфовой комнаты. Для ключа обычного рабочего сейфа
    основная ссылка — пункт 80.
  verified_official_text: false
- rule_id: R231_77
  source_id: NBRK_231_2019
  clause: пункт 77
  summary_ru: При хранении разделяются валюты и номиналы.
  applicability_limits_ru: Нужна стадия хранения в кладовой/сейфовой комнате. Три отдельные пачки в одном сейфе
    не означают автоматически смешанное хранение.
  verified_official_text: false
- rule_id: R231_80
  source_id: NBRK_231_2019
  clause: пункт 80
  summary_ru: Внутренний порядок исключает несанкционированное использование ценностей, печатей, ключей.
  applicability_limits_ru: Не задаёт универсального требования складывать все бумаги и печати именно в сейф. Для
    подробного способа хранения нужен внутренний документ банка и оценка доступности посторонним.
  verified_official_text: false
- rule_id: R231_87_1
  source_id: NBRK_231_2019
  clause: пункт 87-1
  summary_ru: Для инкассации предусмотрены операции с цифровыми документами.
  applicability_limits_ru: Отсутствие видимой бумажной передачи не равно отсутствию документа.
  verified_official_text: false
- rule_id: R14_8
  source_id: NBRK_14_2020
  clause: пункт 8
  summary_ru: Кассовый узел изолируется закрывающимся служебным входом.
  applicability_limits_ru: Норма об изоляции и устройстве. Сам факт открытой произвольной двери не доказывает её
    нарушение; необходимо определить назначение двери и защищённую границу.
  verified_official_text: false
- rule_id: R14_16_1
  source_id: NBRK_14_2020
  clause: пункт 16, подпункт 1), временная редакция до 01.01.2027
  summary_ru: Отдельный вход кассы имеет закрывающуюся на замок дверь.
  applicability_limits_ru: Требование наличия запираемой двери не тождественно безусловному запрету открывать её.
    Для режима постоянного закрытия необходима применимая эксплуатационная норма.
  verified_official_text: false
- rule_id: R55_83
  source_id: MCHS_55_2022
  clause: пункт 83
  summary_ru: После смены электроприборы обесточиваются, с предусмотренными исключениями.
  applicability_limits_ru: Учитывать функциональное назначение и инструкцию изготовителя. Выключение света не доказывает
    конец смены; светящийся экран не показывает надёжно питание от сети или состояние входа в систему.
  verified_official_text: false

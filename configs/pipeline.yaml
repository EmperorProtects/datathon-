analysis_fps: 10
evidence_full_fps: true
# Люди берутся из pose-модели (она выдаёт рамки), отдельный детектор людей не нужен.
detector: {objects_model: weights/objects_best.pt, conf: 0.25, imgsz: 864}
pose: {model: weights/yolo11m-pose.pt, conf: 0.3, kpt_conf: 0.3, imgsz: 640}
tracker: bytetrack.yaml
perception: {batch: 8, half: true, device: 0}
scene:
  static_classes: [counter, safe, door, laptop, cash_counter]
  required_anchors: [counter]   # без стойки стороны кассы не определить → scene_confidence низкий
  anchor_min_conf: 0.4
  anchor_min_presence: 0.3      # доля кадров, где якорь найден
  side_margin_frac: 0.1         # мёртвая зона вокруг центра стойки, в долях её высоты
  zone_margin_frac: 0.15        # расширение зон объектов, в долях размера объекта
  side_zone_extra_width: 0.25   # зоны сторон шире стойки на эту долю её ширины с каждой стороны
roles:
  min_track_sec: 1.0            # более короткие треки — шум (other)
  staff_side_frac: 0.6          # кассир: ≥60% времени на стороне персонала
  client_side_frac: 0.5
  cashier_overlap_tol: 0.2      # фрагмент трека кассира почти не пересекается по времени с основным
  outside_door_frac: 0.9        # за стеклом двери: почти всё время внутри зоны двери …
  outside_feet_above_counter_frac: 0.25  # … и ноги выше верха стойки на долю её высоты
  outside_height_frac: 0.7      # без стойки: … и заметно мельче людей в комнате
  duplicate_iou: 0.5             # вторая рамка на том же кассире (медианный IoU в общих кадрах)
  cashier_part_max_sec: 2.0       # короткий трек, касающийся рамки кассира, — его частичная рамка (рука)
  collector_bag_min_frames: 3   # инкассатор: сумка инкассации у рук/корпуса хотя бы в N кадрах
timeline:
  min_event_sec: 0.3
  gap_sec: 0.5
  object_conf: 0.4
  cash_classes: [cash, cash_bundle]
  desk_objects: [cash, cash_bundle, collector_bag, bag, document, stamp, cup]
  hand_radius_forearm: 0.6      # кисть «держит» объект: в рамке объекта, расширенной на 0.6 длины предплечья
  forearm_fallback_frac: 0.15   # длина предплечья, если локоть/запястье не видны: доля высоты рамки человека
  workstation_margin: 0.3       # кассир на месте: рамка пересекает зону стойки/сейфа, расширенную на эту долю
  recount_motion: 0.12          # пересчёт: средний сдвиг кистей за кадр анализа, в долях предплечья …
  recount_window_sec: 1.0       # … усреднённый по окну
  disappear_reappear_sec: 1.0   # деньги «исчезли», если в этом месте не появились снова за это время
  near_body_frac: 0.3           # доля рамки денег внутри зоны тела
  in_zone_frac: 0.3             # доля рамки денег внутри зоны сейфа / сумки
rules_engine:
  start_grace_sec: 0.5          # «ушёл» в самом начале ролика — кассир ещё не пришёл
  away_min_sec: 2.0
  unattended_min_sec: 1.0
  state_delay_sec: 1.5          # состояние предметов меряем не раньше, чем через 1.5 с после ухода
  state_samples: 4
  laptop_bright_min: 0.25       # доля ярких пикселей в рамке ноутбука — экран светится
  safe_change_min: 0.12         # среднее изменение рамки сейфа от эталона (0..1)
  door_change_min: 0.12
  state_score: 0.6
  outsider_min_sec: 1.0
  multiple_clients_min_sec: 1.5
  desk_item_min_sec: 1.0
  drinking_min_sec: 0.5
  after_client_min_sec: 1.5
  prev_cash_lead_sec: 2.0
  collector_min_sec: 2.0
  recount_lookback_sec: 5.0
  report_min_score: 0.5         # кандидаты ниже — не сообщаются
  nms_window_sec: 3.0
d2: {window_sec: 3.0, stride_sec: 0.5, frames_per_window: 6}
d3: {window_sec: 5.0, stride_sec: 3.0, frames_per_window: 6, max_windows: 50}
fusion: {decay: 0.25, nms_window_sec: 3.0, w: {d1: 1.0, d3: 1.0, d4: 1.0, d2_boost: 0.2}}
gate: {tau_low: 0.35, tau_high: 0.75, min_agree: 2}
omission_timecode: checkpoint
budget_sec: {total: 270, perception: 60, d3: 90, verify: 40}
strict_schema: false
